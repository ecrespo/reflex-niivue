name: CI

# Pull requests run the checks here; pushes to main and tags run them through the publish
# workflow (before it uploads anything).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files
      - run: uv run pytest -m "not browser"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: The wheel carries the generated stubs
        run: unzip -l dist/*.whl | grep -q '\.pyi$'

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: The demo app compiles against the component
        working-directory: niivue_demo
        run: uv run reflex compile

  browser:
    # The demo in headless Chromium with software WebGL2 (offline data, no GPU).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Browser checks (they must run, not skip)
        shell: bash
        run: |
          uv run pytest -m browser -rs | tee pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qE '[0-9]+ skipped' pytest.log; then echo "::error::browser checks skipped"; exit 1; fi
